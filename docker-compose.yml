services:
  fpm:
    build: .
    ulimits:
      core: -1
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
    volumes:
      - ./app:/app:ro
    expose: ["9000"]

  nginx:
    image: nginx:alpine
    depends_on: [fpm]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app:/app:ro
    ports: ["8081:80"]
